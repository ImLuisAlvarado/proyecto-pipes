services:
  - type: web
    name: restaurante-pos-backend
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: restaurante-pos-db
          property: connectionString

databases:
  - name: restaurante-pos-db
    plan: free
    databaseName: restaurante_pos
    user: restaurante_pos_user
